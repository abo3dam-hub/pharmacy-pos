name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install system SQLite (tests load libsqlite3.so.0)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  perf-file-db:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install system SQLite (tests load libsqlite3.so.0)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - run: flutter pub get
      - run: flutter gen-l10n
      # §28 perf guard on real disk I/O: an in-memory DB cannot reproduce the
      # fsync stalls that made an 11.3k-row catalog import hang the UI.
      - run: PHARMACY_FILE_DB=1 flutter test test/inventory_perf_regression_test.dart

  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pharmacy-pos-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    needs: analyze-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: pharmacy-pos-windows
          path: build/windows/x64/runner/Release/