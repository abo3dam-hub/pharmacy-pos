name: pharmacy_pos
description: "Professional Pharmacy Management & POS system (Arabic-first, offline-first)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Database
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.33
  path_provider: ^2.1.5
  path: ^1.9.0

  # State management & DI
  flutter_riverpod: ^2.6.1
  get_it: ^8.0.0

  # Navigation (§36)
  go_router: ^14.0.0

  # Utilities
  uuid: ^4.5.1
  bcrypt: ^1.1.3
  sqlite3: ^2.4.0
  crypto: ^3.0.3
  excel: ^4.0.6
  file_picker: ^12.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  arabic_reshaper: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf